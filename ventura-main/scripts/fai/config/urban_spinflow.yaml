root_dir: "./data/fai_spinflow_raw"
s3_bucket: "ai4h-datasets"
s3_path: "aih"
s3_cache: "/data/fai_spinflow_raw/s3_cache"
n_jobs: 32
robots:
  - ferrite1
  - ferrite2
  - ferrite3
  - ferrite4
  - ferrite5
  - ferrite6
  - ferrite7
sites: # unused currently
  - seattle

topics:
  ferrite1:
    cmd:
      ros_topic: "/ferrite1/control_interface/cmd_vel"
      save_prefix: "control"
    state: 
      ros_topic: "/ferrite1/lo_frontend/odometry"
      save_prefix: "odometry"
    vision_xavier:
      ros_topic: [
        "/ferrite1/camera_front/color/image_raw/compressed", 
        "/ferrite1/camera_front/color/camera_info"
      ]
      save_prefix: [
        "front_camera", 
        "front_camera_info"
      ]
    tf:
      ros_topic: [ "/tf_static"]
      save_prefix: "tf_static"
      frames: [
        [ "ferrite1/base_link", "ferrite1/camera_front/camera_color_optical_frame" ],
      ]
