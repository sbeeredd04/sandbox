filters:
  # - name: "velocity_filter"
  #   type: "controls"
  #   effect: "remove"
  #   params:
  #     allow_turns: True
  #     low_pass_window: 20 # 20 frames @ 40 hz ~1 seconds
  #     linear_velocity: [0.01, 2.0] # True min/max is -1, 1
  #     angular_velocity: [-2.0, 2.0] # True min/max is -1,1
  #     min_length: 150
  - name: "odometry_filter"
    type: "odometry"
    effect: "remove"
    params:
      horizon_frames: 10  
      min_distance: 0.2
      max_ang_vel: 50 # deg/s
      max_ang_disp: 70 # deg