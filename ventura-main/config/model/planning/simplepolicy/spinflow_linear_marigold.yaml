project_name: 'SimplePolicy'
model_name: 'WaypointFlowPolicy'
run_name: 'spinflow_linear_marigold'
save_dir: 'model_ckpts'

weights_ckpt: ''

num_freeze_epochs: 0 # Overrides freeze_unet
num_actions: &num_actions 8
action_dim: &action_dim 3
normalize_actions: False
use_gt_feats: False

# Maps dataloader inputs to model inputs and outputs
dataloader_inputs: 
  - in_key: 'front_rgb'
    out_key: 'rgb_image'
  - in_key: 'goal_caption'
    out_key: 'goal_command'
  - in_key: 'path_mask'
    out_key: 'target_pred' # Override vision encoder predictions 
  - in_key: 'action_label'
    out_key: 'action_label'

defaults:
  - planning@vision_encoder: cfg/fai_controlnet_base_stlang.yaml
  - _self_

pretrained:
  vision_encoder:
    ckpt: '/data/model_ckpts_awslarge2x/ControlNetPlanning/fai_controlnet_base_stlang/20250819/091735/best-0049-0.8484.ckpt'
    optimize_inference: False

postvision_encoder:
  class_name: 'ConvNetSpatial'
  
  encoder:
    name: resnet34
    in_keys: ["rgb_image", "target_pred"]
    feat_dims: [3, 1]          # channels per tensor
    input_res: [240, 320]      # height, width of input after any resize
    out_key: &enc_out_key target_latent
    out_dim: 512

  spatial_softmax:
    num_kp: &num_kps 512
    temperature: 0.1
    learnable_temperature: True
    output_variance: False
    
# Add supplementary fields to vision_encoder
vision_encoder:
  class_name: 'MarigoldModel'

  # BEGIN OVERRIDE KWARGS
  freeze_unet: True

  validation:
    scheduler:
      ensemble_size: 1
  # END OVERRIDE KWARGS

  aggregation:
    strategy: vitsimple                   # (kept from before)
    hidden_dim: *num_kps
    out_key: *enc_out_key

    attn_enabled: False
    attn_kwargs:
      num_heads: 4
      num_layers: 4

        # - name: txt_cond      # text
        #   type: 1d
        #   feat_dim: 1024

flow_sampler:
  name: 'VanillaBC' # Use direct behavior cloning for simple policy

action_head:
  name: 'DenseNetwork' # Use a simple dense network for action prediction
  kwargs:
    embedding_dim: 1024 # num_kps*2
    out_dim: [*num_actions, *action_dim] # [T, xy] coordinates

distance_head:
  embedding_dim: 1024

validation:
  num_actions: *num_actions # 8 steps of actions
  action_range: [-1, 1] # Normalized action range
  action_stats: [0, -4.8, -1.5, 4.8, 4.8, 1.5] # [xmin, ymin, xmax, ymax]
  integrator:
    kwargs:
      integration_method: 'euler'
      dt: 1.0 # 1 second integration
      total_steps: 10 # Number of integration steps
  scheduler:
    name: "DDIMScheduler"
    pretrained_ckpt: 'stabilityai/stable-diffusion-2'
    kwargs:
      cfg_scale: 8.0
      guidance_rescale: 0.5 # 0 to disable, >0 to time over saturated predictions
      ensemble_size: 3 # Sample more to see diversity
      denoising_steps: 10
      processing_res: 0
      match_input_res: false
      resample_method: bilinear
      scale_invariant: true
      shift_invariant: true
      default_denoising_steps: 10
      default_processing_resolution: 320
  evaluation:
    vis_config:
      - name: "bev_actions"
        type: "bev_actions"
        lab_key: "inputs/action_label"
        pred_key: "outputs/action_pred"
        images_per_row: 4
      - name: "image_actions"
        type: "image_actions"
        obs_key: "inputs/rgb_image"
        lab_key: "inputs/action_label"
        pred_key: "outputs/action_pred"
        path_mask_key: "outputs/target_pred"
        images_per_row: 4
        in_range: [-1, 1]
        out_range: [0, 255]
    log_config:
      - name: "inputs/rgb_image"
        type: "rgb"
      - name: "inputs/action_label"
        type: "action_xy"
    metrics:   # Put most important metric first
      - name: mean_l2_error
        lab_key: "inputs/action_label"
        pred_key: "outputs/action_pred"
      - name: mean_asym_hausdorff_distance
        lab_key: "inputs/action_label"
        pred_key: "outputs/action_pred"

batch_size: 32 # Larger batch size improves convergence
max_epochs: &max_epochs 50
accumulate_grad_batches: 8 # Calibrated for 50 epochs @ 100k
optimizer:
  name: Adam
  kwargs:
    betas: [0.9, 0.999]
    lr: &base_lr 0.0001
lr_scheduler:
  name: HalfCosineLR
  kwargs:
    # total_steps: 10000 # dataset size * max_epochs / batch_size / accumulate_grad_batches
    # Single GPU
    total_steps: 2600 # dataset size * max_epochs / batch_size / accumulate_grad_batches
    warmup_steps: 50 # ~1epoch
    last_epoch: *max_epochs
monitor_metric:
  name: 'val/mean_asym_hausdorff_distance'
  mode: "min"
loss:
  - name: "ActionMatchingLoss" # Bad naming convention, essentially just vpred
    log_name: 'action_mse_loss'
    weight: 1.0 # In range of 0-1
    lab_key: "inputs/action_label"
    pred_key: "outputs/action_pred"
    reduction: "mean"
