task: 'image_editing'

input_path: './assets/sample.jpeg'
output_path: './assets/output_image.png'

prompt: 'A photo of an eagle'
neg_prompt: 'blurry, low quality, distorted'

gpu: '1,2'  

optimization:
  titok_checkpoint: 'yucornetto/tokenizer_titok_l32_imagenet'

  # CRITICAL: Must be False for image editing (optimize continuous pre-quantization tokens)
  # Paper Section 4.1: "optimize the continuous feature vectors ẑ(k) as output by the 
  # tokenizer's encoder just prior to the vector quantization step"
  optimize_post_quantization_tokens: False  
  vae_deterministic_sampling: True

  # Paper Section 4.1: "we use the Adam optimizer with a learning rate of 0.1"
  lr: 0.1  
  
  # Paper Section 4.1 & Table 4: Uses 300 iterations for text-guided editing
  # Section 4.2: Uses 400 iterations for "from-scratch" generation
  num_iter: 300  
  
  # Paper Section 5.4 & Algorithm A2: EMA decay of 0.98
  ema_decay: 0.98 
  
  # Paper Algorithm A2: L2 regularization weight (ϖ = 0.02)
  reg_weight: 0.02
  reg_type: 'seed' 
  
  # Paper Section 5.4 & Algorithm A2: Token noise with cosine schedule
  # Ramps from ε²₁ = 0.3 to ε²₂₀₀ = 0
  token_noise: 0.1  
  
  enable_amp: True 
clip:
  # Moderate CFG scale for balanced quality/diversity
  cfg_scale: 1.5  
  
  # Paper Section 5.4 & Table 4: "8 crops encompassing 75% of the image area"
  # for smoothing CLIP gradients
  num_augmentations: 8  
  pretrained_model: 'ViT-B-32'
  pretrained_checkpoint: 'laion2b_s34b_b79k'

image:
  size: 256
  # TiTok expects images in [0, 1] range without normalization
  normalize_mean: [0.0, 0.0, 0.0] 
  normalize_std: [1.0, 1.0, 1.0]

seed: 42
log_interval: 50