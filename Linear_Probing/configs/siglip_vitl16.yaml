# ============================================================================
# Linear Probing Config — SigLIP-ViT-L/16 on ImageNet (train→val)
# ============================================================================

model:
  name: "siglip"
  variant: "vitl16"           # vitb16 | vitl16
  num_classes: 1000

data:
  train_dir: "/scratch/sbeeredd/imagenet/ILSVRC/Data/CLS-LOC/train"
  val_dir: "/scratch/sbeeredd/imagenet/ILSVRC/Data/CLS-LOC/val"
  image_size: 256            # SigLIP native resolution
  num_workers: 12

training:
  epochs: 50
  batch_size: 1024
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
  lr_milestones: [10, 20, 25]
  lr_gamma: 0.1

wandb:
  project: "linear-probing"
  run_name: "siglip_vitl16_linprobe"
  log_interval: 50

seed: 42
gpu_id: 1
