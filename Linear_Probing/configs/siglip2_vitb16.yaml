# ============================================================================
# Linear Probing Config — SigLIP2-ViT-B/16 on ImageNet (train→val)
# ============================================================================

model:
  name: "siglip2"
  variant: "vitb16"           # vitb16 | vitl16 | so400m14
  num_classes: 1000

data:
  train_dir: "/scratch/sbeeredd/imagenet/ILSVRC/Data/CLS-LOC/train"
  val_dir: "/scratch/sbeeredd/imagenet/ILSVRC/Data/CLS-LOC/val"
  image_size: 224             # SigLIP2 base native resolution
  num_workers: 12

training:
  epochs: 50
  batch_size: 1024
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
  lr_milestones: [10, 20, 25]
  lr_gamma: 0.1

wandb:
  project: "linear-probing"
  run_name: "siglip2_vitb16_linprobe"
  log_interval: 50

seed: 42
gpu_id: 0
